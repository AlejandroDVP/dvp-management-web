name: Cache bust DVP service card assets

on:
  push:
    paths:
      - '.github/workflows/cachebust-service-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('build/management-card.css','build/service-cards.v2.css')
          s=s.replace('build/management-card.js','build/service-cards.v2.js')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "DVP Web Update"
          git config user.email "alejandro@dvp.football"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load versioned service card assets"
          git push origin HEAD:main
