name: Apply Football Management card enhancement

on:
  push:
    paths:
      - '.github/workflows/apply-management-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject minimal assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'build/management-card.css' not in s:
              s=s.replace('</head>','<link href="build/management-card.css" rel="stylesheet"/></head>')
          if 'build/management-card.js' not in s:
              s=s.replace('</body>','<script defer src="build/management-card.js"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit minimal enhancement
        shell: bash
        run: |
          git config user.name "DVP Web Update"
          git config user.email "alejandro@dvp.football"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire approved Football Management card enhancement"
          git push origin HEAD:main
