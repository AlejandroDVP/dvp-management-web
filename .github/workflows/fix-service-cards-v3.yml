name: Fix DVP service cards v3

on:
  push:
    paths:
      - '.github/workflows/fix-service-cards-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch homepage and create cache-safe management image
        shell: bash
        run: |
          set -euo pipefail
          cp assets/management-motion-approved.webp assets/management-motion-approved-v3.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('build/service-cards.v2.css','build/service-cards.v3.css')
          s=s.replace('build/service-cards.v2.js','build/service-cards.v3.js')
          # Put the approved image directly in the authored HTML; no JS image swap.
          s=s.replace('src="assets/jugada.webp"','src="assets/management-motion-approved-v3.webp"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "DVP Web Update"
          git config user.email "alejandro@dvp.football"
          git add index.html assets/management-motion-approved-v3.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: render approved management image and service cards v3"
          git push origin HEAD:main
